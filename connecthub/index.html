<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <title>ConnectHub</title>

  <style>

    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }

    #lista { list-style: none; padding: 0; }

    #lista li {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 0.75rem 1rem;

      margin-bottom: 0.5rem;

      border: 1px solid #ddd;

      border-radius: 8px;

    }

    .acoes { display: flex; align-items: center; gap: 10px; }
    .btn-remover {
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-remover:hover { background-color: #cc0000; }

    .info { display: flex; flex-direction: column; }

    .categoria { font-size: 0.75rem; color: #888; text-transform: capitalize; }

    .estrela {

      font-size: 1.5rem;

      cursor: pointer;

      background: none;

      border: none;

      line-height: 1;

    }

    .estrela.favoritado { color: gold; }

    .estrela.favoritado::before { content: "★"; }

    .estrela:not(.favoritado) { color: #ccc; }

    .estrela:not(.favoritado)::before { content: "☆"; }

  </style>

</head>

<body>

  <h1>📋 ConnectHub</h1>
  <form id="form-contato" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
    <input type="text" id="input-nome" placeholder="Nome do contato" required />
    <input type="text" id="input-telefone" placeholder="Telefone" required />
    <select id="select-categoria">
      <option value="amigo">Amigo</option>
      <option value="trabalho">Trabalho</option>
      <option value="familia">Família</option>
      <option value="outro">Outro</option>
    </select>
    <button type="submit" style="padding: 0.5rem; cursor: pointer;">Adicionar Contato</button>
  </form>
  <ul id="lista"></ul>

  <script src="contatos.js"></script>

</body>

</html>
